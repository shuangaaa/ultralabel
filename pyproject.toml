[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ultralabel"
version = "0.1.0"
description = "Ultrasound annotation propagation framework"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "All rights reserved" }
authors = [{ name = "UltraLabel authors" }]
dependencies = ["numpy>=1.24", "PyYAML>=6.0", "Pillow>=10.0"]

[project.optional-dependencies]
vision = ["torch>=2.0"]
qc = ["scikit-learn>=1.3"]
dev = ["pytest>=8.0", "ruff>=0.6"]
demo = ["fastapi>=0.115", "httpx>=0.27", "pydantic>=2.8", "uvicorn[standard]>=0.30", "python-multipart>=0.0.12", "nibabel>=5.2", "imageio>=2.34", "imageio-ffmpeg>=0.5", "pycocotools>=2.0.8"]

[project.scripts]
ultralabel = "ultralabel.cli:main"

[tool.setuptools.packages.find]
include = ["ultralabel*", "demo", "demo.backend*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
